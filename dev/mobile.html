<!doctype html>
<!--
  개발 점검용(배포 빌드에 들어가지 않는다): 게임을 지정한 크기의 틀(iframe)에 띄우고, 콘솔 도우미로 진행·캡처한다.
  열기: 점검용 서버(5174)에서 http://127.0.0.1:5174/dev/mobile.html?w=390&h=844  (가로 740×360, PC 1280×720)
  저장 없는 첫 방문: ?fresh=1  (점검용 서버의 저장만 지운다)
  도우미(바깥 페이지 콘솔, 브라우저 도구의 javascript 실행):
    g()          틀 안 window
    imp(path)    틀 안에서 모듈을 불러온다. 예) (await imp('/src/menu.js')).openMenu(st, { tab: 'inventory' })
    state()      지금 모드·대사·퀘스트·도전·열린 창·오류
    go(id)       스테이지를 바로 시작(꾸미기 창이 뜨면 넘김, 게임 속도 8배)
    step(ms)     ms 동안 자동 진행한 뒤 멈추고 state()
    finish()     쉼터로 돌아올 때까지 자동 진행(최대 40초, 브라우저 도구 45초 제한 안)
  자동 진행은 대사를 바로 넘기므로 연출 화면은 __dev.pauseAt='대사 일부'로 멈춰서 캡처한다.
-->
<html><head><meta charset="utf-8"><title>mobile check</title>
<style>body{margin:0;padding:8px;background:#333}iframe{border:0;background:#fff;display:block}</style></head>
<body><iframe id="a"></iframe>
<script>
const q = new URLSearchParams(location.search);
if (q.get('fresh')) localStorage.clear();
const f = document.getElementById('a');
f.width = q.get('w') ?? 390;
f.height = q.get('h') ?? 844;
f.src = '/';
window.g = () => f.contentWindow;
window.imp = (p) => f.contentWindow.eval(`import('${p}')`);
window.errs = [];
f.addEventListener('load', () => {
  f.contentWindow.addEventListener('error', (e) => errs.push(e.message));
  f.contentWindow.addEventListener('unhandledrejection', (e) => errs.push(String(e.reason)));
});
window.state = () => {
  const w = g(), d = w.document;
  const vis = (id) => !d.getElementById(id).hidden;
  return {
    mode: w.__dev.mode,
    dialog: vis('dialog') && d.getElementById('line').textContent.slice(0, 24),
    quest: vis('quest') && d.getElementById('questTitle').textContent,
    ch: vis('challenge'),
    modal: [...d.querySelectorAll('.modal')].filter((m) => !m.hidden).map((m) => m.id),
    errs,
  };
};
window.step = async (ms) => {
  const w = g();
  w.__dev.auto = true;
  await new Promise((r) => setTimeout(r, ms));
  w.__dev.auto = false;
  await new Promise((r) => setTimeout(r, 300));
  return state();
};
window.go = async (id) => {
  const w = g();
  w.__dev.run(id);
  await new Promise((r) => setTimeout(r, 3500));
  const d = w.document;
  if (!d.getElementById('lookForm').hidden) { d.getElementById('lookSubmit').click(); await new Promise((r) => setTimeout(r, 2500)); }
  w.__dev.speed = 8;
  return state();
};
window.finish = async () => {
  const t0 = performance.now(), w = g();
  w.__dev.auto = true;
  while (performance.now() - t0 < 40000) {
    await new Promise((r) => setTimeout(r, 500));
    const s = state();
    if (s.mode === 'walk' && s.quest === '쉼터') break;
  }
  w.__dev.auto = false;
  return { sec: Math.round((performance.now() - t0) / 1000), ...state() };
};
</script>
</body></html>
