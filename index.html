<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>바이블로그</title>
    <!-- 파비콘: 펼친 성경과 빛, 더다붓 로고에서 가져온 분홍 하트(public/, Codex 이미지 생성으로 그림) -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#2b1d14" />
    <!-- 부팅용 최소 스타일: CSS와 글꼴이 준비되기 전에는 빛 화면만 보인다. 색은 tokens.css의 --color-light와 같다. -->
    <style>
      html, body { margin: 0; height: 100%; background: oklch(98% 0.022 92); }
      html:not(.is-ready) body > :not(#fade) { visibility: hidden; }
      #fade { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: oklch(98% 0.022 92); }
    </style>
  </head>
  <body>
    <main id="title" class="title">
      <div class="title__veil" aria-hidden="true"></div>
      <div class="title__block">
        <h1 class="title__name reveal" style="--i: 0"><img class="title__mark" src="./icon-128.png" alt="" width="128" height="128" />바이블로그</h1>
        <p class="title__lede reveal" style="--i: 1">태초부터, 성경의 순간을 걷다.</p>
        <nav id="menu" class="menu reveal" style="--i: 2" aria-label="시작 메뉴"></nav>
      </div>
    </main>

    <header id="hud" class="hud" hidden>
      <p class="hud__lv" aria-live="polite"><span class="hud__lvword">Lv.</span><span id="hudLv">1</span></p>
      <div class="hud__xp">
        <span class="gauge__track hud__track" role="img" id="hudXpTrack"><span id="hudXp" class="gauge__fill"></span></span>
        <span id="hudXpText" class="hud__xptext"></span>
      </div>
      <p class="hud__talent"><span id="hudTalentIcon" class="hud__icon"></span><span id="hudTalent" class="hud__num">0</span><span class="hud__unit">달란트</span></p>
    </header>
    <button id="menuBtn" class="menu-btn" type="button" aria-keyshortcuts="M" title="메뉴 (M)" hidden><span class="menu-btn__icon" aria-hidden="true"></span><span class="menu-btn__label">메뉴</span><kbd class="menu-btn__key">M</kbd></button>

    <div id="edgeArrow" class="edge-arrow" aria-hidden="true" hidden></div>
    <aside id="quest" class="panel quest" hidden aria-live="polite">
      <p class="quest__label">퀘스트</p>
      <h2 id="questTitle" class="quest__title"></h2>
      <ul id="questItems" class="quest__items"></ul>
    </aside>
    <div id="controls" class="controls" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="gauge" class="panel gauge" hidden>
      <p id="gaugeLabel" class="gauge__label"></p>
      <span class="gauge__track" aria-hidden="true"><span id="gaugeFill" class="gauge__fill"></span></span>
    </div>
    <div id="challenge" class="panel gauge challenge" hidden>
      <p id="chLabel" class="gauge__label"></p>
      <span id="chTrack" class="gauge__track challenge__track" aria-hidden="true"><span id="chZone" class="challenge__zone"></span><span id="chMark" class="challenge__mark"></span></span>
      <div class="challenge__keys">
        <span class="challenge__key"><kbd class="key key--inline">WASD</kbd>이동</span>
        <button id="chAct" class="challenge__key" type="button"><kbd class="key key--inline">Space</kbd><span id="chActName">행동</span></button>
        <button id="chTool" class="challenge__key" type="button" hidden><kbd class="key key--inline">F</kbd><span id="chToolName">도구</span></button>
      </div>
    </div>
    <div id="dexCard" class="panel dexcard" role="status" hidden>
      <p class="quest__label">바이블로그 도감</p>
      <p id="dexTitle" class="dexcard__title"></p>
      <p id="dexText" class="dexcard__text"></p>
      <p id="dexRef" class="codex__ref"></p>
      <p id="dexCount" class="dexcard__count"></p>
    </div>
    <div id="dayTitle" class="day-title" aria-live="polite"></div>
    <button id="nextBtn" class="btn btn--next" type="button" hidden></button>

    <div id="choices" class="choices" role="group" aria-label="고르기" hidden></div>
    <section id="dialog" class="panel dialog" hidden>
      <span id="speaker" class="dialog__speaker"></span>
      <div class="dialog__body">
        <p id="line" class="dialog__line" aria-hidden="true"></p>
        <span class="dialog__next" aria-hidden="true"></span>
      </div>
      <p id="srLine" class="sr-only" aria-live="polite"></p>
      <div class="dialog__foot">
        <span id="ref" class="dialog__ref"></span>
        <button id="dialogBack" class="dialog__back" type="button" title="이전 대사 (← 또는 Backspace)" hidden>이전</button>
      </div>
    </section>

    <form id="nameForm" class="modal" hidden>
      <div class="panel modal__panel" role="dialog" aria-labelledby="nameLabel">
        <label id="nameLabel" for="nameInput" class="modal__title">이름을 알려 주세요</label>
        <input id="nameInput" class="field" maxlength="10" autocomplete="off" enterkeyhint="done" placeholder="최대 10자" />
        <button type="submit" class="btn">확인</button>
      </div>
    </form>

    <form id="lookForm" class="modal modal--side" hidden>
      <div class="panel modal__panel look" role="dialog" aria-labelledby="lookTitle">
        <p id="lookKicker" class="quest__label" hidden></p>
        <h2 id="lookTitle" class="modal__title"></h2>
        <p id="lookText" class="modal__text"></p>
        <div id="lookTabs" class="look__tabs" role="tablist" hidden></div>
        <div id="lookGroups" class="look__groups"></div>
        <div class="look__actions">
          <button id="lookRandom" type="button" class="btn btn--quiet">무작위</button>
          <button id="lookSubmit" type="submit" class="btn">이 모습으로</button>
        </div>
      </div>
    </form>

    <div id="quiz" class="modal" hidden>
      <div class="panel modal__panel quiz" role="dialog" aria-labelledby="quizQ">
        <p id="quizCount" class="quest__label"></p>
        <h2 id="quizQ" class="modal__title"></h2>
        <div id="quizOptions" class="quiz__options"></div>
        <p id="quizFeedback" class="modal__text" aria-live="polite"></p>
        <button id="quizNext" class="btn" type="button" hidden></button>
      </div>
    </div>

    <div id="menuBox" class="modal" hidden>
      <div class="panel modal__panel menu-panel" role="dialog" aria-label="메뉴">
        <div class="menu-panel__top">
          <h2 id="menuTitle" class="modal__title menu-panel__title" hidden>바이블로그 도감</h2>
          <div id="menuTabs" class="look__tabs" role="tablist"></div>
          <button id="menuClose" class="btn btn--quiet menu-panel__close" type="button" title="닫기 (Esc)">닫기</button>
        </div>
        <div id="menuBody" class="menu-panel__body"></div>
      </div>
    </div>

    <div id="mapBox" class="modal" hidden>
      <div class="panel modal__panel map" role="dialog" aria-labelledby="mapTitle">
        <div class="map__top">
          <div>
            <h2 id="mapTitle" class="map__title"></h2>
          </div>
          <p id="mapProgress" class="map__progress"></p>
          <button id="mapClose" class="btn btn--quiet menu-panel__close" type="button" title="닫기 (Esc)">닫기</button>
        </div>
        <div class="map__sheet"><div id="mapNodes" class="map__nodes"></div></div>
        <div id="mapDetail" class="map__detail" aria-live="polite"></div>
      </div>
    </div>

    <div id="fade" class="fade"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
